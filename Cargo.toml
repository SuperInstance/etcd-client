[package]
name = "etcd-client"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/casey-digennaro/etcd-client"
edition = "2021"
description = "Async etcd v3 gRPC-style client for distributed coordination"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
thiserror = "2"
tracing = "0.1"
tonic = "0.12"
prost = "0.13"
